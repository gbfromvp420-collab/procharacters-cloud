<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Offline · Procharacters</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0a0a0f;
        color: #f4f0f5;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #a89bb0;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.65rem 1.1rem;
        border-radius: 0.65rem;
        background: #e11d8f;
        color: #fff;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .brand {
        font-size: 0.65rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #e11d8f;
        margin-bottom: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Procharacters</p>
      <h1>You're offline</h1>
      <p>
        Live chat needs a connection. Check Wi‑Fi or data, then try again — your resume codes still
        work once you're back online.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
