# Cut Pack 03 primes (Gary Drive) → live avatar folders and commit.
# This runner CAN push binary MP4s; the Grok cook machine cannot.
name: cook-pack03

on:
  workflow_dispatch:
    inputs:
      who:
        description: all, males, females, or a first name (liam, emma, …)
        required: true
        default: males

permissions:
  contents: write

jobs:
  cook:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cut Pack 03 loops
        env:
          WHO: ${{ github.event.inputs.who || 'males' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          python3 scripts/cook-pack03.py "$WHO"

      - name: Commit loops
        env:
          WHO: ${{ github.event.inputs.who || 'males' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/avatar frontend/public/avatar/packs/status.json
          if git diff --cached --quiet; then
            echo "No loop changes"
            exit 0
          fi
          git commit -m "feat(packs): Pack 03 loops from Gary Drive (${WHO})"
          git checkout -B "ops/gha-pack03-${WHO}"
          git push -u origin "ops/gha-pack03-${WHO}" --force
