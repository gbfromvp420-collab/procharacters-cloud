# Cut Pack 02 primes (Gary Drive) → live avatar folders and commit.
name: cook-pack02

on:
  workflow_dispatch:
    inputs:
      who:
        description: jenny, sarah, jessica, rachel, samantha, becca, peter, gary, justin, mark, blake, tommy, kenny, or all
        required: true
        default: all

permissions:
  contents: write

jobs:
  cook:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cut Pack 02 loops
        env:
          WHO: ${{ github.event.inputs.who || 'all' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          python3 scripts/cook-pack02.py "$WHO"

      - name: Commit loops
        env:
          WHO: ${{ github.event.inputs.who || 'all' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/avatar frontend/public/avatar/packs/status.json
          if git diff --cached --quiet; then
            echo "No loop changes"
            exit 0
          fi
          git commit -m "feat(packs): Pack 02 loops from Gary Drive (${WHO})"
          git checkout -B "ops/gha-pack02-${WHO}"
          git push -u origin "ops/gha-pack02-${WHO}" --force
