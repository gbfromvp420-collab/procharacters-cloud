# =============================================================================
# CI WebRTC — Python smoke suites + concurrency stress (side service only)
# Product gates: ci-backend.yml · ci-frontend.yml
# =============================================================================

name: CI WebRTC

on:
  push:
    branches: [main, webrtc-engine]
    paths:
      - "app/**"
      - "scripts/run_all_tests.py"
      - "scripts/smoke_full_pipeline.py"
      - "scripts/smoke_trainer_pipeline.py"
      - "scripts/smoke_runpod_provider.py"
      - "scripts/smoke_static_webrtc.py"
      - "scripts/stress_webrtc_sessions.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".env.example"
      - "docs/WEBRTC-ENGINE.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/run_all_tests.py"
      - "scripts/smoke_full_pipeline.py"
      - "scripts/smoke_trainer_pipeline.py"
      - "scripts/smoke_runpod_provider.py"
      - "scripts/smoke_static_webrtc.py"
      - "scripts/stress_webrtc_sessions.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".env.example"
      - "docs/WEBRTC-ENGINE.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-webrtc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 WebRTC suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Deterministic mock providers (no live RunPod)
      VIDEO_PROVIDER: mock
      LLM_PROVIDER: mock
      RUNPOD_FALLBACK_TO_MOCK: "true"
      # Stress suite size (CI-friendly)
      STRESS_SESSIONS: "20"
      STRESS_CONCURRENCY: "20"
      STRESS_BASE_URL: "http://127.0.0.1:8000"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install system libraries (PyAV / aiortc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            ffmpeg \
            libavformat-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            libswresample-dev \
            libopus-dev \
            libvpx-dev \
            libsrtp2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Sanity import check
        run: |
          python -c "import fastapi, httpx, uvicorn, pydantic, pydantic_settings; print('imports ok')"

      - name: Run all tests
        run: python3 scripts/run_all_tests.py --verbose

      - name: Upload uvicorn log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-test-log
          path: .uvicorn-test.log
          if-no-files-found: ignore
