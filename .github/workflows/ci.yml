# =============================================================================
# CI — consolidated PR gate.
# One workflow, one required status: the `all-green` job. Requiring it in branch
# protection means a single check gates merges while each area still runs (and
# reports) as its own job. Pack/cook + deploy workflows live in separate files.
# =============================================================================

name: CI

on:
  push:
    branches: [main, webrtc-engine]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    # Prettier is only meaningful diffed against a PR base.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Incremental adoption: enforce Prettier only on files this PR changed.
      - name: Prettier (changed files)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_REF"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" \
            | grep -E '^(frontend/src/.*\.(ts|tsx|css)|backend/(src|scripts)/.*\.ts)$' || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No formattable TS/CSS changes in this PR."
            exit 0
          fi
          printf 'Checking %s file(s):\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          npx --yes prettier@3.3.3 --check "${FILES[@]}"

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test --if-present
      - name: Build
        run: npm run build
      - name: Local product smoke (health + characters + session)
        working-directory: .
        env:
          DATABASE_URL: ""
          PORT: "3001"
          HOST: "127.0.0.1"
          NODE_ENV: test
          ACCOUNTS_PROVIDER: json
        run: bash scripts/smoke-local-product.sh --skip-install

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: Lint
        run: npm run lint
      - name: Autostart deep-link checks
        run: npm run test:deeplink
      - name: Unit tests
        run: npm run test --if-present
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001

  python:
    name: Python 3.11 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIDEO_PROVIDER: mock
      LLM_PROVIDER: mock
      RUNPOD_FALLBACK_TO_MOCK: "true"
      STRESS_SESSIONS: "20"
      STRESS_CONCURRENCY: "20"
      STRESS_BASE_URL: "http://127.0.0.1:8000"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system libraries (PyAV / aiortc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            ffmpeg \
            libavformat-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            libswresample-dev \
            libopus-dev \
            libvpx-dev \
            libsrtp2-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt "ruff~=0.16.4"
      - name: Ruff (rules pinned in pyproject.toml)
        run: ruff check app
      - name: Sanity import check
        run: python -c "import fastapi, httpx, uvicorn, pydantic, pydantic_settings; print('imports ok')"
      - name: Run all tests
        run: python3 scripts/run_all_tests.py --verbose
      - name: Upload uvicorn log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-test-log
          path: .uvicorn-test.log
          if-no-files-found: ignore

  all-green:
    name: all-green
    if: always()
    needs: [format, backend, frontend, python]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: |
          echo "format=${{ needs.format.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "python=${{ needs.python.result }}"
          for job in backend frontend python; do
            case "$job" in
              backend) r="${{ needs.backend.result }}";;
              frontend) r="${{ needs.frontend.result }}";;
              python) r="${{ needs.python.result }}";;
            esac
            if [ "$r" != "success" ]; then
              echo "::error::required job '$job' did not pass (result=$r)"
              exit 1
            fi
          done
          # `format` is skipped on non-PR events; success or skipped are both fine.
          fr="${{ needs.format.result }}"
          if [ "$fr" != "success" ] && [ "$fr" != "skipped" ]; then
            echo "::error::format job did not pass (result=$fr)"
            exit 1
          fi
          echo "All required checks passed."
