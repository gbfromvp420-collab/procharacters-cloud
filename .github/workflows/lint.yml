# Monorepo lint / typecheck.
# Node apps live in frontend/ and backend/ — there is no root package-lock.json.
# actions/setup-node cache: npm looks at the workspace root unless
# cache-dependency-path points at the real lockfiles (that miss is what
# failed PR #71 before any lint ran).
name: Lint

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0' # weekly

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can diff PR-changed files against the base.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Incremental Prettier adoption: enforce formatting only on files this PR
      # changed, so we get a consistent style on new/edited code without a
      # disruptive repo-wide reformat. Config: root .prettierrc.json (printWidth 100).
      - name: Prettier (changed files)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_REF"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" \
            | grep -E '^(frontend/src/.*\.(ts|tsx|css)|backend/(src|scripts)/.*\.ts)$' || true)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No formattable TS/CSS changes in this PR."
            exit 0
          fi
          printf 'Checking %s file(s):\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          npx --yes prettier@3.3.3 --check "${FILES[@]}"

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      # ESLint config lives in frontend/.eslintrc.json (next/core-web-vitals).
      # Enforced: fails on lint errors, warnings stay non-blocking.
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Backend install
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm ci

      - name: Backend prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm run prisma:generate

      - name: Backend typecheck
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm run typecheck

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python dev deps
        run: |
          python -m pip install --upgrade pip
          pip install "ruff~=0.16.4"

      # Rules + target are pinned in pyproject.toml so this is a real gate.
      - name: Run ruff
        run: ruff check app
