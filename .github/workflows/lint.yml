name: Lint

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0' # weekly

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Frontend lint
        run: |
          cd frontend
          npm ci
          npm run lint || exit 1
      - name: Backend typecheck
        run: |
          cd backend
          npm ci
          npm run typecheck || exit 1
      - name: Python ruff check
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install python dev deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run ruff
        run: |
          ruff app || true
