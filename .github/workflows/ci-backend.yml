name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run build

      - name: Smoke health check
        run: |
          PORT=3001 HOST=127.0.0.1 NODE_ENV=test node dist/index.js &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null; then
              echo "Health OK"
              kill $PID
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          kill $PID || true
          exit 1
