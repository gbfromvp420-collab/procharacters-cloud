name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "prisma/**"
      - "prisma.config.ts"
      - "prompts/**"
      - "characters/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "prisma/**"
      - "prisma.config.ts"
      - "prompts/**"
      - "characters/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci
        env:
          # Prisma generate may read config; no real DB in CI
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Typecheck
        run: npm run typecheck --if-present
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Smoke health check
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          PORT: "3001"
          HOST: "127.0.0.1"
          NODE_ENV: test
          ACCOUNTS_PROVIDER: json
        run: |
          node dist/index.js &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3001/health" > /tmp/health.json; then
              echo "Health OK"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          exit 1
