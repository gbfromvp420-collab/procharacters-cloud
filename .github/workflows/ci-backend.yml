name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "prisma/**"
      - "prisma.config.ts"
      - "prompts/**"
      - "characters/**"
      - "scripts/ensure-prisma-link.sh"
      - "scripts/smoke-local-product.sh"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "prisma/**"
      - "prisma.config.ts"
      - "prompts/**"
      - "characters/**"
      - "scripts/ensure-prisma-link.sh"
      - "scripts/smoke-local-product.sh"
      - ".github/workflows/ci-backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci
        env:
          # Prisma generate may read config; no real DB in CI
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      # Schema at repo-root prisma/ — prisma:generate runs scripts/ensure-prisma-link.sh
      - name: Prisma generate
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Typecheck
        run: npm run typecheck --if-present
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Local product smoke (health + characters + session)
        env:
          DATABASE_URL: ""
          PORT: "3001"
          HOST: "127.0.0.1"
          NODE_ENV: test
          ACCOUNTS_PROVIDER: json
        working-directory: .
        run: bash scripts/smoke-local-product.sh --skip-install
