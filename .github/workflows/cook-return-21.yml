name: cook-return-21

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/cook-return-21.py
      - name: Push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/lib/live/forge-dna.ts \
                  backend/src/lib/memory/session-export.ts \
                  backend/src/lib/observability/metrics.ts \
                  backend/src/routes/sessions.ts
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(return): 21+ forge/export + count Continue resumes"
          git checkout -B ops/cook-return-21
          git push -u origin ops/cook-return-21 --force
